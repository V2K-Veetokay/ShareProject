<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>File Share</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 20px;
            }
            .container {
                background: white;
                border-radius: 12px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
                width: 100%;
                max-width: 900px;
                overflow: hidden;
            }
            .header {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 30px;
                text-align: center;
            }
            .header h1 {
                font-size: 28px;
                margin-bottom: 8px;
            }
            .breadcrumb {
                background: #f5f5f5;
                padding: 12px 20px;
                font-size: 14px;
                color: #666;
                border-bottom: 1px solid #e0e0e0;
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
            }
            .breadcrumb a {
                color: #667eea;
                text-decoration: none;
                cursor: pointer;
                padding: 4px 8px;
                border-radius: 4px;
                transition: background 0.2s;
            }
            .breadcrumb a:hover {
                background: #e8e8ff;
            }
            .content {
                padding: 20px;
                min-height: 300px;
            }
            .upload-area {
                border: 2px dashed #667eea;
                border-radius: 8px;
                padding: 30px;
                text-align: center;
                cursor: pointer;
                transition: all 0.3s;
                background: #f8f9ff;
            }
            .upload-area:hover {
                background: #f0f0ff;
                border-color: #764ba2;
            }
            .upload-area.dragover {
                background: #e8e8ff;
                border-color: #764ba2;
                box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
            }
            .file-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
                margin-bottom: 20px;
                margin-top: 20px;
            }
            .file-item {
                background: #f9f9f9;
                border: 1px solid #e0e0e0;
                border-radius: 8px;
                padding: 15px;
                text-align: center;
                cursor: pointer;
                transition: all 0.3s;
                text-decoration: none;
                color: #333;
            }
            .file-item:hover {
                background: #f0f0ff;
                border-color: #667eea;
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            }
            .file-icon {
                font-size: 36px;
                margin-bottom: 10px;
            }
            .file-name {
                font-size: 13px;
                font-weight: 500;
                word-break: break-word;
            }
            .file-size {
                font-size: 11px;
                color: #999;
                margin-top: 8px;
            }
            .empty-state {
                text-align: center;
                padding: 60px 20px;
                color: #999;
            }
            .loader {
                text-align: center;
                padding: 40px 20px;
                color: #667eea;
            }
            .spinner {
                border: 4px solid #f0f0f0;
                border-top: 4px solid #667eea;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 0.8s linear infinite;
                margin: 0 auto 15px;
            }
            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }
            .footer {
                background: #f5f5f5;
                padding: 15px 20px;
                text-align: center;
                font-size: 12px;
                color: #999;
                border-top: 1px solid #e0e0e0;
            }
            .alert {
                padding: 12px 16px;
                border-radius: 6px;
                margin-bottom: 15px;
                font-size: 14px;
            }
            .alert-success {
                background: #d4edda;
                border: 1px solid #c3e6cb;
                color: #155724;
            }
            .alert-error {
                background: #f8d7da;
                border: 1px solid #f5c6cb;
                color: #721c24;
            }
            #fileInput {
                display: none;
            }
            .upload-progress {
                display: none;
                margin-top: 15px;
            }
            .progress-bar {
                width: 100%;
                height: 8px;
                background: #e0e0e0;
                border-radius: 4px;
                overflow: hidden;
            }
            .progress-fill {
                height: 100%;
                background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
                width: 0%;
                transition: width 0.3s;
            }
            .upload-status {
                font-size: 13px;
                color: #667eea;
                margin-top: 8px;
                font-weight: 500;
            }
            @media (max-width: 600px) {
                .file-grid {
                    grid-template-columns: repeat(
                        auto-fill,
                        minmax(120px, 1fr)
                    );
                    gap: 10px;
                }
                .header h1 {
                    font-size: 20px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>📁 File Share</h1>
            </div>
            <div class="breadcrumb" id="breadcrumb"></div>
            <div class="content" id="content">
                <div class="upload-section">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">📤</div>
                        <div class="upload-text">
                            Drag files here or click to select
                        </div>
                        <div class="upload-subtext">
                            Multiple files supported
                        </div>
                    </div>
                    <input type="file" id="fileInput" multiple />
                    <div class="upload-progress" id="uploadProgress">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="upload-status" id="uploadStatus">
                            Uploading...
                        </div>
                    </div>
                </div>
                <div id="alerts"></div>
                <div class="loader" id="loader">
                    <div class="spinner"></div>
                    <p>Loading...</p>
                </div>
                <div class="file-grid" id="fileGrid"></div>
            </div>
            <div class="footer">Sharing folder contents</div>
        </div>

        <script>
            let currentPath = "/";
            const icons = {
                folder: "📁",
                image: "🖼️",
                video: "🎬",
                audio: "🎵",
                pdf: "📄",
                zip: "🗜️",
                code: "💻",
                text: "📝",
                file: "📋",
            };

            const uploadArea = document.getElementById("uploadArea");
            const fileInput = document.getElementById("fileInput");
            const uploadProgress = document.getElementById("uploadProgress");
            const progressFill = document.getElementById("progressFill");
            const uploadStatus = document.getElementById("uploadStatus");
            const alerts = document.getElementById("alerts");

            uploadArea.addEventListener("click", () => fileInput.click());
            uploadArea.addEventListener("dragover", (e) => {
                e.preventDefault();
                uploadArea.classList.add("dragover");
            });
            uploadArea.addEventListener("dragleave", () => {
                uploadArea.classList.remove("dragover");
            });
            uploadArea.addEventListener("drop", (e) => {
                e.preventDefault();
                uploadArea.classList.remove("dragover");
                handleFiles(e.dataTransfer.files);
            });
            fileInput.addEventListener("change", (e) => {
                handleFiles(e.target.files);
            });

            function handleFiles(files) {
                if (files.length === 0) return;
                const formData = new FormData();
                for (let file of files) {
                    formData.append("files", file);
                }
                uploadProgress.style.display = "block";
                progressFill.style.width = "0%";
                uploadStatus.textContent = `Uploading ${files.length} file(s)...`;

                fetch(`/api/upload${currentPath}`, {
                    method: "POST",
                    body: formData,
                })
                    .then((res) => res.json())
                    .then((data) => {
                        uploadProgress.style.display = "none";
                        fileInput.value = "";
                        if (data.success) {
                            showAlert(
                                `✓ Successfully uploaded ${data.files.length} file(s)!`,
                                "success",
                            );
                            loadFiles();
                        } else {
                            showAlert(
                                `✗ Upload failed: ${data.error}`,
                                "error",
                            );
                        }
                    })
                    .catch((err) => {
                        uploadProgress.style.display = "none";
                        showAlert(`✗ Upload error: ${err.message}`, "error");
                    });
            }

            function showAlert(message, type) {
                const alertDiv = document.createElement("div");
                alertDiv.className = `alert alert-${type}`;
                alertDiv.textContent = message;
                alerts.appendChild(alertDiv);
                setTimeout(() => alertDiv.remove(), 5000);
            }

            function getFileIcon(name, isDir) {
                if (isDir) return icons.folder;
                const ext = name.split(".").pop().toLowerCase();
                if (["jpg", "jpeg", "png", "gif", "svg", "webp"].includes(ext))
                    return icons.image;
                if (["mp4", "avi", "mkv", "mov"].includes(ext))
                    return icons.video;
                if (["mp3", "wav", "flac", "m4a"].includes(ext))
                    return icons.audio;
                if (ext === "pdf") return icons.pdf;
                if (["zip", "rar", "7z", "tar"].includes(ext)) return icons.zip;
                if (["js", "py", "java", "cpp", "html", "css"].includes(ext))
                    return icons.code;
                if (["txt", "md", "doc"].includes(ext)) return icons.text;
                return icons.file;
            }

            function formatFileSize(bytes) {
                if (bytes === 0) return "-";
                const k = 1024;
                const sizes = ["B", "KB", "MB", "GB"];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return (
                    Math.round((bytes / Math.pow(k, i)) * 100) / 100 +
                    " " +
                    sizes[i]
                );
            }

            function updateBreadcrumb() {
                const parts = currentPath.split("/").filter((p) => p);
                let html = `<a onclick="navigate('/')">Home</a>`;
                let path = "";
                for (let part of parts) {
                    path += "/" + part;
                    html += `<span>/</span><a onclick="navigate('${path}')">${part}</a>`;
                }
                document.getElementById("breadcrumb").innerHTML = html;
            }

            function navigate(path) {
                currentPath = path;
                loadFiles();
            }

            function loadFiles() {
                updateBreadcrumb();
                const loader = document.getElementById("loader");
                const fileGrid = document.getElementById("fileGrid");
                loader.style.display = "block";
                fileGrid.innerHTML = "";

                fetch(`/api/list${currentPath}`)
                    .then((res) => res.json())
                    .then((data) => {
                        loader.style.display = "none";
                        if (data.length === 0) {
                            fileGrid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><div class="empty-state-icon">📭</div><p>This folder is empty</p></div>`;
                            return;
                        }
                        for (let item of data) {
                            const icon = getFileIcon(item.name, item.isDir);
                            const size = formatFileSize(item.size);
                            if (item.isDir) {
                                const div = document.createElement("div");
                                div.className = "file-item";
                                div.onclick = () => navigate(item.path);
                                div.innerHTML = `<div class="file-icon">${icon}</div><div class="file-name">${item.name}</div>`;
                                fileGrid.appendChild(div);
                            } else {
                                const a = document.createElement("a");
                                a.className = "file-item";
                                a.href = item.path;
                                a.download = true;
                                a.innerHTML = `<div class="file-icon">${icon}</div><div class="file-name">${item.name}</div><div class="file-size">${size}</div>`;
                                fileGrid.appendChild(a);
                            }
                        }
                    })
                    .catch((err) => {
                        loader.style.display = "none";
                        fileGrid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;"><div class="empty-state-icon">❌</div><p>Error loading files</p></div>`;
                    });
            }
            loadFiles();
        </script>
    </body>
</html>
